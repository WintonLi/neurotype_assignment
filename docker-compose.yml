services:
  app:
    image: yunxili/neurotype-assignment:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
      - "8000:8000"
    volumes:
      - ./api/example_data/app.db:/app/api/data/app.db
    # Keep runtime simple and avoid host UID/GID file permission surprises
    user: "0:0"
    restart: unless-stopped
